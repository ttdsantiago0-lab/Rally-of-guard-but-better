# Compila Rally of the Guard en cada push y deja el jar listo para descargar
# (pestaña Actions del repositorio -> la corrida -> "Artifacts" -> rallyguard-jar).
#
# Por qué existe: el PC de David tiene Java 11 y su red no llega a maven.neoforged.net,
# y el espacio en la nube de Claude tampoco; GitHub Actions sí. Así Claude puede
# cambiar código, subirlo, y saber si compila sin que David tenga que estar presente.
#
# Guard Villagers NO se guarda en el repositorio (no es nuestro para redistribuir):
# se descarga del CDN oficial de Modrinth (proyecto H1sntfo8, versión b8N5GP8u, 2.4.11)
# y se verifica por SHA-256 antes de usarlo. Si el hash no coincide, la compilación falla.
# Nunca usar github.com/ShackleSailorTrek/guard-villagers (fork troyanizado, ver CLAUDE.md).

name: build

# Repositorio público desde 2026-11-08: Actions sin coste en las máquinas de GitHub (4 núcleos, 16 GB), hasta 16 presets
# en paralelo. Los portátiles de David quedan de respaldo.
#
# Dónde corre (2026-11-06): en las máquinas de GitHub (gastan los minutos del plan) o, si la variable del repositorio
# RALLY_RUNNER vale "self-hosted" (Settings -> Secrets and variables -> Actions -> Variables), en un PC propio con el
# runner de GitHub instalado (Linux; ver docs/SIMULACIONES.md, "Correr en un PC propio"). Borrar la variable = volver a
# las máquinas de GitHub.
#
# Simulación sin pantalla (job "sim"): corre si el mensaje del commit contiene [sim], o a mano desde
# Actions -> build -> "Run workflow" eligiendo el preset (quick, coord, v4...). Va aparte de la
# compilación porque gasta minutos (repositorio privado: ~2000 min/mes en el plan gratuito).
on:
  push:
    branches-ignore: [sim-results]
  workflow_dispatch:
    inputs:
      preset:
        description: 'Preset de simulación (/rally sim batch <preset>)'
        default: 'quick'
      speed:
        description: 'Velocidad (normal | sprint)'
        default: 'sprint'
      seed:
        description: 'Primera semilla (confirmación del torneo: otra base, p. ej. 1001)'
        default: '1'

permissions:
  contents: read

# Un push cancela el build anterior de su rama, pero NUNCA una simulación lanzada a mano: el 2026-11-04 la final
# n=30 del torneo (dispatch 41881179537) murió porque el push siguiente compartía este grupo. Cada dispatch va en
# su propio grupo (su run_id) y corre hasta el final.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('sim-{0}', github.run_id) || format('build-{0}', github.ref) }}
  cancel-in-progress: true

env:
  GV_URL: https://cdn.modrinth.com/data/H1sntfo8/versions/b8N5GP8u/guardvillagers-2.4.11-1.21.1.jar
  GV_FILE: guardvillagers-2.4.11-1.21.1.jar
  GV_SHA256: d9bb75b09b2312fe071d9c8892757207fe014e21e8ff3bf551b6715bf350601f

jobs:
  build:
    runs-on: ${{ vars.RALLY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Descargar Guard Villagers (oficial) y verificar SHA-256
        run: |
          mkdir -p libs
          curl -fsSL --retry 3 -o "libs/$GV_FILE" "$GV_URL"
          echo "$GV_SHA256  libs/$GV_FILE" | sha256sum -c -

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace -Prally_mods_dir=

      - name: SHA-256 del jar
        run: sha256sum build/libs/*.jar | tee build/libs/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rallyguard-jar
          path: |
            build/libs/*.jar
            build/libs/SHA256SUMS.txt
          retention-days: 30

  # Varios presets separados por comas (p. ej. "t1-z,t1-s,t1-c") corren EN PARALELO, una máquina por preset.
  plan:
    needs: build
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[sim]')
    runs-on: ${{ vars.RALLY_RUNNER || 'ubuntu-latest' }}
    outputs:
      presets: ${{ steps.p.outputs.presets }}
    steps:
      - id: p
        env:
          IN: ${{ github.event.inputs.preset || 'quick' }}
        run: echo "presets=$(python3 -c "import json,os;print(json.dumps([x.strip() for x in os.environ['IN'].split(',') if x.strip()]))")" >> "$GITHUB_OUTPUT"

  sim:
    needs: plan
    runs-on: ${{ vars.RALLY_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: write   # solo para guardar los resultados en la rama sim-results
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        preset: ${{ fromJSON(needs.plan.outputs.presets) }}
    env:
      PRESET: ${{ matrix.preset }}
      SPEED: ${{ github.event.inputs.speed || 'sprint' }}
      SEED: ${{ github.event.inputs.seed || '1' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Descargar Guard Villagers (oficial) y verificar SHA-256
        run: |
          mkdir -p libs
          curl -fsSL --retry 3 -o "libs/$GV_FILE" "$GV_URL"
          echo "$GV_SHA256  libs/$GV_FILE" | sha256sum -c -

      - name: Preparar servidor (mundo plano, EULA)
        run: |
          for d in runs/server run; do
            mkdir -p "$d"
            echo "eula=true" > "$d/eula.txt"
            printf '%s\n' 'level-type=minecraft\:flat' 'online-mode=false' 'spawn-protection=0' \
              'max-tick-time=-1' 'generate-structures=false' 'spawn-monsters=false' 'difficulty=normal' \
              'view-distance=6' 'simulation-distance=6' > "$d/server.properties"
          done

      - name: Simulación sin pantalla
        run: |
          chmod +x gradlew
          timeout 105m ./gradlew runServer -PsimAutorun="$PRESET" -PsimSpeed="$SPEED" -PsimSeed="$SEED" -Prally_mods_dir= --stacktrace \
            | tee sim-console.log | grep --line-buffered -E "rallyguard|Sim |ERROR|Exception|Done \(" || true
          test -n "$(find runs run -path '*rally-sim/*' -name summary.md 2>/dev/null)" || { echo "No hay summary.md"; tail -200 sim-console.log; exit 1; }

      - name: Resumen en la página de la corrida
        if: always()
        run: |
          f=$(find runs run -path '*rally-sim/*' -name summary.md 2>/dev/null | head -1)
          if [ -n "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; else echo "Sin resumen (ver sim-console.log)" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Guardar resultados en la rama sim-results (legibles por la API, sin descargar artefactos)
        if: always()
        run: |
          d=$(find runs run -path '*rally-sim/*' -name summary.md 2>/dev/null | head -1 | xargs -r dirname)
          [ -n "$d" ] || exit 0
          batch=$(basename "$d")
          git config user.name "rally-sim-bot"; git config user.email "rally-sim-bot@users.noreply.github.com"
          git fetch origin sim-results:sim-results 2>/dev/null || true
          rm -rf /tmp/simres && git worktree prune && git worktree add /tmp/simres sim-results 2>/dev/null || { git worktree add --detach /tmp/simres && git -C /tmp/simres checkout --orphan sim-results && git -C /tmp/simres rm -rqf . || true; }
          mkdir -p "/tmp/simres/$batch"
          cp "$d"/summary.md "$d"/summary.json "$d"/runs.jsonl "/tmp/simres/$batch/" 2>/dev/null || true
          echo "$GITHUB_SHA" > "/tmp/simres/$batch/commit.txt"
          git -C /tmp/simres add -A && git -C /tmp/simres commit -qm "sim $batch ($PRESET) @ ${GITHUB_SHA::7}"
          for i in 1 2 3 4 5 6; do
            git -C /tmp/simres push -q origin HEAD:sim-results && exit 0
            echo "push fallo (intento $i), reintento"; sleep $((i*7))
            git -C /tmp/simres pull -q --rebase origin sim-results || true
          done; exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rally-sim-${{ env.PRESET }}
          path: |
            runs/**/rally-sim/**
            run/rally-sim/**
            runs/**/logs/latest.log
            runs/**/crash-reports/**
            sim-console.log
          if-no-files-found: warn
          retention-days: 30
