# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.debug=false

## Environment Properties
# Must match a real, published NeoForge build for this Minecraft version.
# Verified against Guard Villagers' own 1.21.1 branch (seymourimadeit/guardvillagers) gradle.properties
# during Phase 0 assessment - see PORTING_PLAN.md section 3 and the Appendix.
minecraft_version=1.21.1
minecraft_version_range=[1.21.1, 1.22)
neo_version=21.1.215
neo_version_range=[21.1.0,)
loader_version_range=[2,)

neogradle.subsystems.parchment.minecraftVersion=1.21
neogradle.subsystems.parchment.mappingsVersion=2024.06.23

## Mod Properties
mod_id=rallyguard
mod_name=Rally of the Guard
mod_license=CC0-1.0
mod_version=0.1.0-neoforge-skeleton
mod_group_id=net.hfstack.rallyguard
mod_authors=Hyan Ferreira (hfstack); NeoForge port by David (private/experimental)
mod_description=Hire, command, patrol, and rally Guard Villagers - private experimental NeoForge 1.21.1 port.
pack_format_number=18

## Dependency (Guard Villagers) - see libs/README.md. Optional at this Phase 1 stage;
## build.gradle only adds it to the classpath if the jar is actually present.
guardvillagers_jar=guardvillagers-2.3.2-1.21.1.jar
